<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>35 anos</title>
    <meta
      name="description"
      content="Convite para celebrar 35 anos com muito carinho, música e presença."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="35 anos" />
    <meta
      property="og:description"
      content="Você está convidado para celebrar comigo este momento especial."
    />
    <meta property="og:url" content="https://seu-dominio.com/" />
    <meta property="og:image" content="assets/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="35 anos" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="35 anos" />
    <meta
      name="twitter:description"
      content="Você está convidado para celebrar comigo este momento especial."
    />
    <meta name="twitter:image" content="assets/og-image.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        const siteUrl = window.location.origin + window.location.pathname;
        const ogUrl = document.querySelector('meta[property="og:url"]');
        const ogImage = document.querySelector('meta[property="og:image"]');
        const twitterImage = document.querySelector('meta[name="twitter:image"]');

        if (ogUrl) ogUrl.setAttribute('content', siteUrl);
        if (ogImage) ogImage.setAttribute('content', window.location.origin + '/assets/og-image.svg');
        if (twitterImage) twitterImage.setAttribute('content', window.location.origin + '/assets/og-image.svg');
      })();
    </script>
  </head>
  <body>
    <main class="convite">
      <div class="luzes-wrap" aria-hidden="true">
        <svg class="luzes-svg" viewBox="0 0 400 70" xmlns="http://www.w3.org/2000/svg">
          <path class="fio" d="M-10 6 Q 65 46 140 10 Q 215 -22 200 10 Q 185 42 260 10 Q 335 -22 410 6"></path>

          <defs>
            <radialGradient id="brilhoLamp" cx="50%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#FFE3B8"></stop>
              <stop offset="55%" stop-color="#C2793D"></stop>
              <stop offset="100%" stop-color="#7A4A22"></stop>
            </radialGradient>
            <filter id="glowLamp" x="-150%" y="-150%" width="400%" height="400%">
              <feGaussianBlur stdDeviation="3.2" result="blur"></feGaussianBlur>
              <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
              </feMerge>
            </filter>
          </defs>

          <g class="lampada" filter="url(#glowLamp)">
            <line x1="20" y1="10" x2="20" y2="17" stroke="#7A4A22" stroke-width="1"></line>
            <ellipse cx="20" cy="22" rx="6" ry="8" fill="url(#brilhoLamp)"></ellipse>
          </g>
          <g class="lampada" filter="url(#glowLamp)">
            <line x1="80" y1="28" x2="80" y2="35" stroke="#7A4A22" stroke-width="1"></line>
            <ellipse cx="80" cy="40" rx="6" ry="8" fill="url(#brilhoLamp)"></ellipse>
          </g>
          <g class="lampada" filter="url(#glowLamp)">
            <line x1="140" y1="10" x2="140" y2="17" stroke="#7A4A22" stroke-width="1"></line>
            <ellipse cx="140" cy="22" rx="6" ry="8" fill="url(#brilhoLamp)"></ellipse>
          </g>
          <g class="lampada" filter="url(#glowLamp)">
            <line x1="200" y1="10" x2="200" y2="17" stroke="#7A4A22" stroke-width="1"></line>
            <ellipse cx="200" cy="22" rx="6" ry="8" fill="url(#brilhoLamp)"></ellipse>
          </g>
          <g class="lampada" filter="url(#glowLamp)">
            <line x1="260" y1="10" x2="260" y2="17" stroke="#7A4A22" stroke-width="1"></line>
            <ellipse cx="260" cy="22" rx="6" ry="8" fill="url(#brilhoLamp)"></ellipse>
          </g>
          <g class="lampada" filter="url(#glowLamp)">
            <line x1="320" y1="28" x2="320" y2="35" stroke="#7A4A22" stroke-width="1"></line>
            <ellipse cx="320" cy="40" rx="6" ry="8" fill="url(#brilhoLamp)"></ellipse>
          </g>
          <g class="lampada" filter="url(#glowLamp)">
            <line x1="380" y1="10" x2="380" y2="17" stroke="#7A4A22" stroke-width="1"></line>
            <ellipse cx="380" cy="22" rx="6" ry="8" fill="url(#brilhoLamp)"></ellipse>
          </g>
        </svg>
      </div>

      <p class="eyebrow">VOCÊ ESTÁ CONVIDADO</p>
      <h1 class="titulo-grande">35</h1>
      <div class="regua" aria-hidden="true"></div>
      <p class="subtitulo">VEM COMEMORAR COMIGO</p>

      <div class="moldura">
        <img src="assets/cover.svg" alt="Foto de comemoração de 35 anos" />

        <button
          class="toque"
          type="button"
          aria-label="Abrir perfil do Instagram"
          data-instagram="https://www.instagram.com/rezafortemeier/"
        >
          <span class="anel" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"></circle>
            </svg>
          </span>
          <span class="toque-legenda">Instagram</span>
        </button>
      </div>

      <div class="detalhes">
        <p class="linha-nome">35 — um brinde a mais um ano</p>

        <div class="item">
          <span class="rotulo">DATA</span>
          <span class="valor">19 de setembro <small>sábado · a partir das 19h</small></span>
        </div>

        <div class="item">
          <span class="rotulo">LOCAL</span>
          <span class="valor">Bar do Reza Forte <small>Rua Tenente Cerqueira Leite, 7 — Baixo Méier</small></span>
        </div>

        <a
          class="botao-confirmar"
          href="https://wa.me/5521992888778?text=Bora%20comemorar%21%20Confirmando%20presen%C3%A7a%20%F0%9F%8E%89"
          target="_blank"
          rel="noopener noreferrer"
        >
          Confirmar presença no WhatsApp
        </a>

        <p class="aviso">Confirme o quanto antes.</p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
