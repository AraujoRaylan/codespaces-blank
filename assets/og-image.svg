<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Convite de 35 anos</title>
  <desc id="desc">Imagem de compartilhamento do convite para comemoração de 35 anos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#181d1e"/>
      <stop offset="100%" stop-color="#101314"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f4d7a2" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#c2793d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5e2323" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f4d7a2"/>
      <stop offset="100%" stop-color="#c2793d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g opacity="0.9">
    <path d="M70 112 Q 200 175 320 110 Q 460 40 600 110 Q 740 180 830 110 Q 955 40 1085 110" fill="none" stroke="#c2793d" stroke-width="2" stroke-opacity="0.45"/>
    <g fill="#f0d8a4" opacity="0.95">
      <circle cx="180" cy="138" r="7"/>
      <circle cx="332" cy="104" r="8"/>
      <circle cx="505" cy="140" r="7"/>
      <circle cx="680" cy="106" r="8"/>
      <circle cx="905" cy="140" r="7"/>
      <circle cx="1040" cy="105" r="8"/>
    </g>
  </g>

  <g text-anchor="middle" fill="#f4efe7">
    <text x="600" y="150" font-size="26" letter-spacing="8" font-family="Arial, Helvetica, sans-serif" fill="#b89f86">VOCÊ ESTÁ CONVIDADO</text>
    <text x="600" y="330" font-size="210" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#f4efe7">35</text>
    <rect x="560" y="360" width="80" height="4" fill="url(#gold)"/>
    <text x="600" y="410" font-size="32" letter-spacing="6" font-family="Arial, Helvetica, sans-serif" fill="#b89f86">VEM COMEMORAR COMIGO</text>
  </g>

  <g opacity="0.82">
    <rect x="180" y="440" width="840" height="120" rx="12" fill="#111618" stroke="#a56535" stroke-opacity="0.7"/>
    <text x="600" y="490" text-anchor="middle" font-size="28" font-family="Arial, Helvetica, sans-serif" fill="#e9dcc4">19 de setembro • sábado • a partir das 19h</text>
    <text x="600" y="530" text-anchor="middle" font-size="25" font-family="Arial, Helvetica, sans-serif" fill="#b89f86">Bar do Reza Forte • Rua Tenente Cerqueira Leite, 7</text>
  </g>
</svg>
